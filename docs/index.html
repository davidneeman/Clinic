// The versions built around the logo (data-look 2l…): the curtain's logo lands on the
// opening screen's, and as the page scrolls the name rises out of its oval into the header
// (and comes back down on the way up). Nothing moves when motion is turned off.
function initLogoMotion() {
  const root = document.documentElement;
  const header = document.querySelector('.site-header');
  const heroLogo = document.querySelector('.hero .hero-logo');
  const brandLogo = header?.querySelector('.brand-logo');
  const word = heroLogo?.querySelector('.logo-word');
  if (!heroLogo || !brandLogo || !word) return;
  const logoLook = () => (root.dataset.look || '').startsWith('2l');
  const intro = document.querySelector('.intro');
  const introLogo = intro?.querySelector('.intro-logo');
  let introBusy = false;

  // ---- The curtain's logo lands on the opening screen ----
  if (introLogo && logoLook() && !reducedMotion() && getComputedStyle(intro).display !== 'none') {
    introBusy = true;
    const stop = new AbortController();
    const land = (quick) => {
      if (!introBusy) return;
      introBusy = false;
      stop.abort();
      for (const a of introLogo.getAnimations({ subtree: true })) a.finish();
      const from = introLogo.getBoundingClientRect();
      const to = heroLogo.getBoundingClientRect();
      const finish = () => {
        root.classList.toggle('logo-landed', true);
        intro.style.visibility = 'hidden';
        request();
      };
      if (!introLogo.animate) {
        finish();
        return;
      }
      const ms = quick ? 450 : 950;
      // no place to land on screen (the booking page, or opened further down): just fade out
      if (!from.width || !to.width || to.bottom < 0 || to.top > window.innerHeight) {
        intro.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms * 0.6, easing: 'ease-out', fill: 'forwards' }).finished.then(finish, finish);
        return;
      }
      const k = to.width / from.width;
      const dx = to.left + to.width / 2 - (from.left + from.width / 2);
      const dy = to.top + to.height / 2 - (from.top + from.height / 2);
      introLogo.animate([{ transform: 'none' }, { transform: `translate(${dx}px, ${dy}px) scale(${k})` }], {
        duration: ms,
        easing: 'cubic-bezier(0.65, 0, 0.25, 1)',
        fill: 'forwards',
      });
      intro
        .animate([{ backgroundColor: getComputedStyle(intro).backgroundColor }, { backgroundColor: 'transparent' }], {
          duration: ms * 0.8,
          delay: ms * 0.2,
          easing: 'ease-in-out',
          fill: 'forwards',
        })
        .finished.then(finish, finish);
    };
    // once the logo has drawn itself (or straight away if the visitor scrolls, taps or types)
    Promise.all(introLogo.getAnimations({ subtree: true }).map((a) => a.finished)).then(
      () => land(false),
      () => {},
    );
    setTimeout(() => land(false), 2600);
    for (const type of ['wheel', 'touchstart', 'pointerdown', 'keydown']) {
      window.addEventListener(type, () => land(true), { passive: true, signal: stop.signal });
    }
  }

  // ---- The name rises into the header ----
  const NS = 'http://www.w3.org/2000/svg';
  const dock = document.createElementNS(NS, 'svg');
  dock.setAttribute('class', 'logo-dock');
  dock.setAttribute('viewBox', '0 0 610 111');
  dock.setAttribute('aria-hidden', 'true');
  dock.setAttribute('focusable', 'false');
  const use = document.createElementNS(NS, 'use');
  use.setAttribute('href', brandLogo.querySelector('use')?.getAttribute('href') || 'images/logo-wordmark.svg#word');
  dock.append(use);
  document.body.append(dock);

  const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
  let queued = false;
  // (classList.toggle with a second argument changes nothing when the class is already right,
  // so the observer below isn't woken by these updates)
  function update() {
    queued = false;
    const active =
      logoLook() && !reducedMotion() && heroLogo.getClientRects().length > 0 && brandLogo.getClientRects().length > 0;
    root.classList.toggle('dock-on', active);
    if (!active) {
      root.classList.toggle('dock-done', false);
      heroLogo.classList.toggle('is-docking', false);
      heroLogo.style.removeProperty('--dock');
      dock.classList.toggle('is-flying', false);
      return;
    }
    const y = window.scrollY;
    const r = heroLogo.getBoundingClientRect();
    const u = r.width / 852;
    const tf = getComputedStyle(word).transform;
    const shift = tf && tf !== 'none' ? new DOMMatrixReadOnly(tf).m42 : 0; // the name sits lower when the small lines are left out
    const from = { left: r.left + 121 * u, top: r.top + (56 + shift) * u, width: 610 * u };
    from.height = (from.width * 111) / 610;
    // where the header's logo sits when the header is showing
    const hr = header.getBoundingClientRect();
    const br = brandLogo.getBoundingClientRect();
    const to = { left: br.left, top: (parseFloat(getComputedStyle(header).top) || 0) + (br.top - hr.top), width: br.width };
    to.height = br.height;
    const span = Math.max(48, from.top + y + from.height / 2 - (to.top + to.height / 2));
    const t = introBusy ? 0 : clamp01(y / span);
    heroLogo.style.setProperty('--dock', t.toFixed(3));
    if (t > 0) root.classList.toggle('logo-landed', true); // finish the drawing at once
    heroLogo.classList.toggle('is-docking', t > 0);
    root.classList.toggle('dock-done', t >= 1);
    const flying = t > 0 && t < 1;
    dock.classList.toggle('is-flying', flying);
    if (flying) {
      const e = ease(t);
      const left = from.left + (to.left - from.left) * e;
      const top = from.top + (to.top - from.top) * e;
      const width = from.width + (to.width - from.width) * e;
      dock.style.width = `${from.width}px`;
      dock.style.transform = `translate(${left.toFixed(2)}px, ${top.toFixed(2)}px) scale(${(width / from.width).toFixed(4)})`;
    }
  }
  function request() {
    if (!queued) {
      queued = true;
      requestAnimationFrame(update);
    }
  }
  window.addEventListener('scroll', request, { passive: true });
  window.addEventListener('resize', request);
  window.addEventListener('hashchange', request);
  window.addEventListener('load', request);
  document.fonts?.ready.then(request);
  // a version picked in the switcher, or motion turned off in the accessibility menu
  new MutationObserver(request).observe(root, { attributes: true, attributeFilter: ['data-look', 'class'] });
  request();
}

function renderPhotos() {
  const content = getSiteData()?.content || {};
  for (const img of document.querySelectorAll('img[data-photo]')) {
    const slot = img.dataset.photo;
    // (while choosing the opening photo with ?photo, the chooser decides)

    const photo = photoSource(content.photos?.[slot] || DEFAULT_PHOTOS[slot], slot, mediaBase());
    if (photo && img.getAttribute('srcset') !== photo.srcset) {
      img.srcset = photo.srcset;
      img.src = photo.src;
      img.width = photo.width;
      img.height = photo.height;
    }
    if (slot === 'about') img.alt = typeof content.aboutAlt === 'string' ? content.aboutAlt : DEFAULT_ABOUT_ALT;
  }

function renderGallery() {
  const mosaic = $('mosaic');
  const content = getSiteData()?.content;
  // As it comes with the site: the photos already in the page.
  if (!mosaic || (!Array.isArray(content?.gallery) && !mosaic.dataset.custom)) return;
  const photos = galleryPhotos(content, mediaBase());
  const cols = [...mosaic.querySelectorAll('.mosaic-col')];
  // In order, column by column, as evenly as they go.
  let at = 0;
  cols.forEach((col, c) => {
    const n = Math.floor(photos.length / cols.length) + (c < photos.length % cols.length ? 1 : 0);
    col.replaceChildren(
      ...photos.slice(at, at + n).map((p) =>
        el(
          'button',

        ),
      ),
    );
    at += n;
  });
  mosaic.dataset.custom = '1';
}

// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------

const utc = (s) => {
  const [y, m, d = 1] = s.split('-').map(Number);

async function loadMonth() {
  const key = `${state.service.id}|${state.month}`;
  renderCalendar();
  if (!cache.has(key)) {
    state.loading = true;
    renderCalendar();
    try {
      const params = new URLSearchParams({ service: state.service.id, from: `${state.month}-01`, to: lastDay(state.month) });
      const { days } = await api(`/api/availability?${params}`);

    const open = (days[date] || []).length > 0;

async function submit(e) {

  const transfer = viaTransfer();
  if ((data.name || '').trim().length < 2 || (paying && !isFullName(data.name))) bad.push('name');
  if (paying || transfer || !viaWhatsApp()) {
    if (!PHONE_RE.test((data.phone || '').trim()) || (paying && !isMobile(data.phone))) bad.push('phone');
    if (data.email && !EMAIL_RE.test(data.email.trim())) bad.push('email');

/** Paid: wait for the payment company to confirm it (a few seconds), then show the booking. */
async function returnFromPayment(ref) {
  const mine = saved.get(ref);
  const booking = mine?.booking || { ref };
  state.service = state.config.services.find((s) => s.id === booking.serviceId) || state.service;
  $('booking-flow').hidden = true;
  document.querySelector('.page-hero').hidden = true;
  $('confirmation').hidden = false;
  $('confirm-email').hidden = true;
  $('confirm-whatsapp').hidden = true;
  const title = $('confirm-title');
  title.dataset.i18n = 'book.payChecking';
  title.textContent = t('book.payChecking');
  $('confirm-text').textContent = '';
  $('confirm-details').replaceChildren();

  // The client came back through Grow's "paid" address, so a payment was made: wait for it,
  // even past the end of its hold (a late payment still counts while the time is free).
  let status = 'pending';
  for (let i = 0; i < 15 && status !== 'confirmed'; i++) {
    if (i) await new Promise((r) => setTimeout(r, 2000));
    try {
      ({ status } = await api(`/api/bookings/status?ref=${encodeURIComponent(ref)}`));
    } catch {
      status = 'pending';
    }
  }
  if (status === 'confirmed' && state.service && booking.date) return showConfirmation({ ...booking, paid: true }, false);
  const key = status === 'confirmed' ? 'book.successTitle' : 'book.payPending';
  title.dataset.i18n = key;
  title.textContent = t(key);
  if (status === 'confirmed') {
    $('confirm-details').replaceChildren(el('dt', {}, t('book.ref')), el('dd', {}, el('span', { class: 'ref' }, ref)));
  }
}

/** The client cancelled on the payment page: free the held time and let them choose again. */
async function returnCancelled(ref) {
  const mine = saved.get(ref);
  if (mine?.token) await api('/api/bookings/release', { method: 'POST', body: { ref, token: mine.token } }).catch(() => {});
  const s = mine && state.config.services.find((x) => x.id === mine.booking.serviceId);
  if (s) {
    state.service = s;
    state.month = monthOf(mine.booking.date);
  }
  return s;
}

let confirmed = null;

function renderConfirmation() {
  if (!confirmed) return;
  const { booking, whatsappHref, payTo, status } = confirmed;
  const title = $('confirm-title');
  title.dataset.i18n = payTo ? (status === 'confirmed' ? 'book.statusConfirmed' : 'book.transferTitle') : whatsappHref ? 'book.waTitle' : 'book.successTitle';
  title.textContent = t(title.dataset.i18n);
  $('confirm-text').textContent = payTo
    ? booking.plan === 'card'
      ? t('book.transferCardText')
      : t('book.transferText', { amount: formatPrice(booking.price) })
    : whatsappHref
      ? t('book.waText')
      : t('book.successText', { name: booking.name });
  // Bit or PayBox: where to send it, and the booking's state while David hasn't approved yet.
  $('confirm-pay').hidden = !(payTo && booking.plan !== 'card' && status === 'pending');
  if (payTo) {
    $('pay-phone').textContent = payTo.phone;
    $('pay-note').replaceChildren(t('book.payNoteBefore'), el('strong', { class: 'ref' }, booking.ref));
    const statusKey = { confirmed: 'book.statusConfirmed', cancelled: 'book.statusCancelled', expired: 'book.statusCancelled' }[status] || 'book.statusPending';
    $('pay-status').textContent = t(statusKey);
    $('pay-status').classList.toggle('is-done', status === 'confirmed');

    $('pay-status').hidden = true;
  }

  const rows = [

    ['book.service', pick(state.service.name)],
    ['book.date', fmtDate(booking.date)],
    ['book.time', el('bdi', {}, booking.time)],
    booking.paid && booking.price != null && ['book.paid', formatPrice(booking.price)],
    payTo && ['book.amount', booking.plan === 'card' ? t('book.fromCard') : formatPrice(booking.price)],
  ].filter(Boolean);
  $('confirm-details').replaceChildren(...rows.flatMap(([k, v]) => [el('dt', {}, t(k)), el('dd', {}, v)]));
}

function showConfirmation(booking, emailed, whatsappHref = null, payTo = null) {
  confirmed = { booking, whatsappHref, payTo, status: payTo ? 'pending' : null };
  if (payTo) watchApproval(booking.ref);

  $('confirm-title').focus({ preventScroll: true });

/** While the page stays open, shows when David approves the booking (or cancels it). */
function watchApproval(ref) {
  let tries = 0;
  const timer = setInterval(async () => {
    tries++;
    try {
      const { status } = await api(`/api/bookings/status?ref=${encodeURIComponent(ref)}`);
      if (status !== confirmed?.status) {
        confirmed.status = status;
        renderConfirmation();
      }
      if (status !== 'pending') clearInterval(timer);
    } catch {}
    if (tries >= 80) clearInterval(timer); // about 20 minutes
  }, 15_000);

      $('plan-options').hidden = false;
      $('confirm-btn').dataset.i18n = 'book.saveBooking';
      $('confirm-btn').textContent = t('book.saveBooking');
      const wanted = new URLSearchParams(location.search).get('plan');
      const pick = document.querySelector(`#plan-options input[value="${wanted === 'pack' || wanted === 'card' ? wanted : 'single'}"]`);
      if (pick) pick.checked = true;
      $('plan-options').addEventListener('change', renderSummary);
    } else if (viaWhatsApp()) {
      // The request is sent from the client's own WhatsApp, so the practitioner
      // already sees their number: no phone or email fields.
      $('b-phone').closest('.form-row').hidden = true;
      $('confirm-btn').dataset.i18n = 'book.confirmWhatsapp';
      $('confirm-btn').textContent = t('book.confirmWhatsapp');
    }
    const preset = config.services.find((s) => s.id === null);
    if (preset) state.service = preset;
    const back = viaPayment() ? new URLSearchParams(location.search) : null;
    const paidRef = back?.get('paid');
    const cancelledRef = back?.get('cancelled');
    if (paidRef || cancelledRef) history.replaceState(null, '', '/book');
    renderAll();
    if (paidRef) return returnFromPayment(paidRef);
    if (cancelledRef) {
      return returnCancelled(cancelledRef).then((s) => {
        renderAll();
        goTo(s ? 2 : 1, { focus: false, back: false });
        setAlert('time-alert', 'info', t('book.payCancelled'));
      });
    }
    goTo(preset ? 2 : 1, { focus: false, back: false });
  })
  .catch(() => {
    $('service-options').replaceChildren(el('p', { class: 'alert alert-error' }, t('common.error')));
  });

window.__bookRefresh = () => {
  if (state.config) renderAll();
};
window.__bookPreset = (id) => {
  const s = state.config?.services.find((x) => x.id === id);
  if (s) {
    selectService(s);
    goTo(2, { focus: false });
  }
};
window.__bookReset = () => {
  confirmed = null;
  cache.clear();
  state.service = null;
  state.date = null;
  state.time = null;
  $('details-form').reset();
  $('booking-flow').hidden = false;
  document.querySelector('.page-hero').hidden = false;
  $('confirmation').hidden = true;
  renderAll();
  goTo(1, { focus: false });
};

}

// ---- Router: #book shows the booking page, anything else the home page ----
{
  const home = document.getElementById('page-home');
  const bookPage = document.getElementById('page-book');
  let pendingService = null;
  // Where the home page was scrolled to when the booking page opened, so the
  // browser's back button returns to the same spot (not to the top).
  let homeY = 0;
  let fromLink = false;
  function route() {
    const h = location.hash.slice(1);
    const isBook = h === 'book';
    const wasBook = document.body.dataset.route === 'book';
    const historyBack = wasBook && !isBook && !fromLink;
    fromLink = false;
    if (isBook && document.body.dataset.route === 'home') homeY = window.scrollY;
    home.hidden = isBook;
    bookPage.hidden = !isBook;
    document.body.dataset.titleKey = isBook ? 'meta.bookTitle' : 'meta.homeTitle';
    document.body.dataset.route = isBook ? 'book' : 'home';
    applyTranslations();
    if (isBook) {
      prefetchCalendar();
      window.scrollTo({ top: 0, behavior: 'instant' });
      if (pendingService) {
        const id = pendingService;
        pendingService = null;
        loadConfig().then(() => window.__bookPreset(id));
      }
    } else if (historyBack) {
      window.scrollTo({ top: homeY, behavior: 'instant' });
    } else if (h && h !== 'top' && h !== 'main') {
      document.getElementById(h)?.scrollIntoView();
    } else {
      window.scrollTo({ top: 0, behavior: 'instant' });
    }
  }
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    const href = a.getAttribute('href');
    e.preventDefault();
    if (href === '#main') {
      // The skip link: go to the content of the page that's showing, without leaving it.
      const main = document.getElementById('main');
      main.tabIndex = -1;
      main.focus({ preventScroll: true });
      main.scrollIntoView();
      return;
    }
    if (a.id === 'book-another') window.__bookReset();
    if (a.dataset.service) pendingService = a.dataset.service;
    fromLink = true;
    if (location.hash === href) route();
    else location.hash = href;
  });
  window.addEventListener('hashchange', route);
  route();
}

refreshSiteData();
  </script>

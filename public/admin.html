<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ניהול</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/admin.js"></script>
</head>
<body data-title-key="meta.adminTitle">
  <header class="site-header admin-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <span class="brand-orb" aria-hidden="true"></span>
        <svg class="brand-logo" viewBox="0 0 610 111" aria-hidden="true" focusable="false"><use href="/images/logo-wordmark.svg#word"></use></svg>
        <span class="brand-text">
          <span class="brand-name" data-biz="name"></span>
          <span class="brand-tagline" data-i18n="admin.title"></span>
        </span>
      </a>
      <div class="header-actions">
        <button class="icon-btn lang-btn" id="lang-toggle" type="button"></button>
        <button class="icon-btn" id="theme-toggle" type="button"></button>
      </div>
    </div>
  </header>

  <main id="main" class="container admin-wrap">
    <!-- Login -->
    <section id="login-view" hidden>
      <div class="panel login-card">
        <h1 class="section-title" id="login-title" data-i18n="admin.loginTitle"></h1>
        <p class="alert alert-error" id="admin-disabled" data-i18n="admin.disabled" hidden></p>
        <form class="form" id="login-form" novalidate>
          <div class="field">
            <label for="password" data-i18n="admin.password"></label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <div id="login-alert" role="status"></div>
          <button class="btn btn-primary btn-block" type="submit" data-i18n="admin.login"></button>
        </form>
        <a class="btn btn-outline btn-block" id="access-logout" href="/cdn-cgi/access/logout" data-i18n="admin.logout" hidden></a>
        <!-- On Cloudflare: Face ID / Touch ID (passkeys), no password -->
        <!-- The steps are worded for a phone or a computer (admin.js → renderSignIn) -->
        <div id="passkey-login" hidden>
          <ol class="steps" id="passkey-steps"></ol>
          <button class="btn btn-primary btn-block" type="button" id="passkey-btn" data-i18n="admin.passkeyLogin"></button>
          <p class="panel-sub login-note" id="passkey-note"></p>
          <!-- Or with Google, once a manager connected their Google account (admin.js) -->
          <div id="google-login" hidden>
            <p class="login-or" data-i18n="admin.or"></p>
            <button class="btn btn-outline btn-block btn-google" type="button" id="google-login-btn">
              <span class="google-g" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg></span>
              <span data-i18n="admin.googleLogin"></span>
            </button>
          </div>
        </div>
        <form class="form" id="register-form" novalidate hidden>
          <p class="alert alert-info" id="register-computer" data-i18n="admin.inviteOnComputer" hidden></p>
          <ol class="steps" id="register-steps"></ol>
          <div class="field">
            <label for="reg-name" data-i18n="admin.yourName"></label>
            <input id="reg-name" name="name" autocomplete="name" maxlength="60" required>
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="register-btn" data-i18n="admin.registerBtn"></button>
          <p class="panel-sub login-note" data-i18n="admin.inviteOnce"></p>
        </form>
        <div id="passkey-alert" role="status"></div>
      </div>
    </section>

    <!-- Dashboard -->
    <section id="dashboard" hidden>
      <div class="admin-top">
        <h1 data-i18n="admin.title"></h1>
        <div class="toolbar">
          <a class="btn btn-outline btn-sm" href="/" data-i18n="admin.viewSite"></a>
          <button class="btn btn-ghost btn-sm" type="button" id="logout" data-i18n="admin.logout"></button>
        </div>
      </div>

      <!-- Just joined: how to come back next time -->
      <div class="panel device-offer" id="welcome" role="status" hidden>
        <p id="welcome-text"></p>
        <div class="toolbar">
          <button class="btn btn-primary btn-sm" type="button" id="welcome-close" data-i18n="admin.gotIt"></button>
        </div>
      </div>

      <!-- Signed in on a computer with the phone: offer to save the sign-in on this computer -->
      <div class="panel device-offer" id="device-offer" role="status" hidden>
        <p data-i18n="admin.deviceOffer"></p>
        <div class="toolbar">
          <button class="btn btn-primary btn-sm" type="button" id="device-offer-add" data-i18n="admin.addDevice"></button>
          <button class="btn btn-ghost btn-sm" type="button" id="device-offer-close" data-i18n="admin.notNow"></button>
        </div>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-bookings" aria-controls="panel-bookings" aria-selected="true" data-tab="bookings"><span data-i18n="admin.tabBookings"></span><span class="badge" id="waiting-badge" hidden></span></button>
        <button class="tab" role="tab" id="tab-clients" aria-controls="panel-clients" aria-selected="false" data-tab="clients" data-i18n="admin.tabClients" hidden></button>
        <button class="tab" role="tab" id="tab-schedule" aria-controls="panel-schedule" aria-selected="false" data-tab="schedule" data-i18n="admin.tabSchedule"></button>
        <button class="tab" role="tab" id="tab-messages" aria-controls="panel-messages" aria-selected="false" data-tab="messages"><span data-i18n="admin.tabMessages"></span><span class="badge" id="unread-badge" hidden></span></button>
        <button class="tab" role="tab" id="tab-site" aria-controls="panel-site" aria-selected="false" data-tab="site" data-i18n="admin.tabSite" hidden></button>
        <button class="tab" role="tab" id="tab-people" aria-controls="panel-people" aria-selected="false" data-tab="people" data-i18n="admin.tabPeople" hidden></button>
      </div>

      <!-- Bookings -->
      <div role="tabpanel" id="panel-bookings" aria-labelledby="tab-bookings">
        <p class="tab-intro" data-i18n="admin.introBookings"></p>
        <div class="toolbar" id="booking-scopes">
          <button class="btn btn-outline btn-sm" type="button" data-scope="upcoming" aria-pressed="true" data-i18n="admin.upcoming"></button>
          <button class="btn btn-outline btn-sm" type="button" data-scope="past" aria-pressed="false" data-i18n="admin.past"></button>
          <button class="btn btn-outline btn-sm" type="button" data-scope="cancelled" aria-pressed="false" data-i18n="admin.cancelled"></button>
        </div>
        <div class="list" id="bookings-list"></div>
      </div>

      <!-- Schedule -->
      <div role="tabpanel" id="panel-schedule" aria-labelledby="tab-schedule" hidden>
        <form id="schedule-form" novalidate>
          <h2 class="subhead" data-i18n="admin.weeklyHours"></h2>
          <p class="panel-sub" data-i18n="admin.weeklyHoursSub"></p>
          <div class="hours" id="hours"></div>
          <div class="settings-grid">
            <div class="field"><label for="s-interval" data-i18n="admin.slotInterval"></label><select id="s-interval" name="slotInterval"></select><small class="field-hint" data-i18n="admin.slotIntervalHint"></small></div>
            <div class="field"><label for="s-buffer" data-i18n="admin.bufferMinutes"></label><select id="s-buffer" name="bufferMinutes"></select><small class="field-hint" data-i18n="admin.bufferMinutesHint"></small></div>
            <div class="field"><label for="s-notice" data-i18n="admin.minNoticeHours"></label><select id="s-notice" name="minNoticeHours"></select><small class="field-hint" data-i18n="admin.minNoticeHoursHint"></small></div>
            <div class="field"><label for="s-ahead" data-i18n="admin.maxDaysAhead"></label><select id="s-ahead" name="maxDaysAhead"></select><small class="field-hint" data-i18n="admin.maxDaysAheadHint"></small></div>
          </div>
          <p class="draft-note" id="schedule-unsaved" hidden></p>
          <div id="schedule-alert" role="status"></div>
          <button class="btn btn-primary" type="submit" data-i18n="admin.save"></button>
        </form>

        <h2 class="subhead" data-i18n="admin.blocked"></h2>
        <p class="panel-sub" data-i18n="admin.blockedSub"></p>
        <form class="inline-form block-form" id="block-form" novalidate>
          <div class="field"><label for="block-days" data-i18n="admin.blockDays"></label><div id="block-days-slot"></div></div>
          <div class="field"><label for="block-note" data-i18n="admin.blockNote"></label><input id="block-note" name="note" maxlength="120" data-i18n-attr="placeholder:admin.blockNotePlaceholder"></div>
          <button class="btn btn-outline" type="submit" data-i18n="admin.block"></button>
        </form>
        <div id="block-alert" role="status"></div>
        <div class="list" id="blocked-list"></div>
      </div>

      <!-- Messages -->
      <div role="tabpanel" id="panel-messages" aria-labelledby="tab-messages" hidden>
        <p class="tab-intro" id="messages-intro" data-i18n="admin.introMessages"></p>
        <div class="list" id="messages-list"></div>
      </div>

      <!-- Clients -->
      <div role="tabpanel" id="panel-clients" aria-labelledby="tab-clients" hidden>
        <p class="tab-intro" data-i18n="admin.introClients"></p>
        <div class="toolbar">
          <div class="field client-search">
            <input id="client-search" type="search" autocomplete="off" data-i18n-attr="placeholder:admin.searchClients;aria-label:admin.searchClients">
          </div>
          <button class="btn btn-outline btn-sm" type="button" id="client-add" data-i18n="admin.addClient"></button>
        </div>
        <div id="client-detail" hidden></div>
        <div class="list" id="clients-list"></div>
      </div>

      <!-- The site: notices at the top of it, and its texts, prices and photos (admin-site.js) -->
      <div role="tabpanel" id="panel-site" aria-labelledby="tab-site" hidden>
        <section class="site-part" aria-labelledby="notices-title">
          <div class="site-part-head">
            <div>
              <h2 class="subhead" id="notices-title" data-i18n="admin.noticesTitle"></h2>
              <p class="panel-sub" data-i18n="admin.noticesSub"></p>
            </div>
            <button class="btn btn-primary btn-sm" type="button" id="notice-add" data-i18n="admin.noticeAdd"></button>
          </div>
          <div id="notice-editor" hidden></div>
          <div class="list" id="notices-list"></div>
        </section>

        <section class="site-part" aria-labelledby="content-title">
          <div class="site-part-head">
            <div>
              <h2 class="subhead" id="content-title" data-i18n="admin.contentTitle"></h2>
              <p class="panel-sub" data-i18n="admin.contentSub"></p>
            </div>
            <a class="btn btn-outline btn-sm" href="/" target="_blank" rel="noopener" data-i18n="admin.viewSite"></a>
          </div>
          <div id="content-editor"></div>
        </section>

        <!-- While there are changes that aren't saved -->
        <div class="save-bar" id="save-bar" hidden>
          <p class="save-restored" id="save-restored" hidden></p>
          <div class="save-bar-inner">
            <span class="save-bar-text" data-i18n="admin.unsaved"></span>
            <button class="btn btn-primary btn-sm" type="button" id="content-save" data-i18n="admin.save"></button>
            <button class="btn btn-ghost btn-sm" type="button" id="content-discard" data-i18n="admin.discard"></button>
          </div>
          <div id="save-alert" role="status"></div>
        </div>
      </div>

      <!-- Who may sign in -->
      <div role="tabpanel" id="panel-people" aria-labelledby="tab-people" hidden>
        <p class="panel-sub" data-i18n="admin.peopleSub"></p>
        <div class="list" id="people-list"></div>
        <h2 class="subhead" data-i18n="admin.inviteTitle"></h2>
        <p class="panel-sub" data-i18n="admin.inviteSub"></p>
        <form class="inline-form" id="invite-form" novalidate>
          <div class="field"><label for="invite-name" data-i18n="admin.inviteName"></label><input id="invite-name" name="name" maxlength="60" required></div>
          <button class="btn btn-outline" type="submit" data-i18n="admin.inviteBtn"></button>
        </form>
        <div id="invite-result"></div>
      </div>
    </section>
  </main>
</body>
</html>

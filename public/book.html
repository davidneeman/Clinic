<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>קביעת טיפול</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#ede3ce">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/js/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+Hebrew:wght@300;400;500&family=Noto+Sans+Hebrew:wdth,wght@62.5..100,200..500&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/book.js"></script>
</head>
<body data-title-key="meta.bookTitle" data-route="book">
  <a class="skip-link" href="#main" data-i18n="a11y.skip"></a>

  <header class="site-header" id="top">
    <div class="header-inner">
      <a class="brand" href="/">
        <span class="brand-orb" aria-hidden="true"></span>
        <svg class="brand-logo" viewBox="0 0 610 111" aria-hidden="true" focusable="false"><use href="/images/logo-wordmark.svg#word"></use></svg>
        <span class="brand-text">
          <span class="brand-name" data-biz="name"></span>
          <span class="brand-tagline" data-biz="tagline"></span>
        </span>
      </a>
      <nav class="main-nav" id="main-nav" data-i18n-attr="aria-label:a11y.menu">
        <ul>
          <li><a href="/#treatments" data-i18n="nav.treatments"></a></li>
          <li><a href="/#gallery" data-i18n="nav.gallery"></a></li>
          <li><a href="/#about" data-i18n="nav.about"></a></li>
          <li><a href="/#visit" data-i18n="nav.visit"></a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="a11y-toggle" type="button" aria-expanded="false" aria-controls="a11y-panel" data-icon="a11y" data-i18n-attr="aria-label:a11y.menuLabel;title:a11y.menuLabel"></button>
        <button class="icon-btn" id="theme-toggle" type="button"></button>
        <button class="icon-btn nav-toggle" id="nav-toggle" type="button" aria-controls="main-nav" aria-expanded="false" data-i18n-attr="aria-label:a11y.menu" data-icon="menu"></button>
      </div>
      <span class="scroll-progress" aria-hidden="true"></span>
    </div>
  </header>

  <main id="main">
    <section class="page-hero container">
      <p class="pill-label" data-biz="tagline"></p>
      <h1 data-i18n="book.title"></h1>
      <p class="lead" data-i18n="book.lead"></p>
    </section>

    <div class="container" id="booking-flow">
      <!-- Signing in (once it's set up): the sessions left on the client's card, their bookings,
           and a session from the card booked at once (account.js) -->
      <section class="panel account" id="account" aria-labelledby="account-title" hidden>
        <div class="account-head">
          <span class="account-icon" data-icon="user"></span>
          <div class="account-text">
            <h2 class="account-title" id="account-title" tabindex="-1"></h2>
            <p class="account-sub" id="account-sub"></p>
          </div>
          <div class="account-actions" id="account-actions"></div>
        </div>
        <div class="account-body" id="account-body" hidden></div>
        <div id="account-alert" role="status"></div>
      </section>

      <ol class="stepper" id="stepper">
        <li data-step="1"><span class="num">1</span><span class="label" data-i18n="book.step1"></span></li>
        <li data-step="2"><span class="num">2</span><span class="label" data-i18n="book.step2"></span></li>
        <li data-step="3"><span class="num">3</span><span class="label" data-i18n="book.step3"></span></li>
      </ol>

      <div class="booking-layout">
        <div class="panel">
          <!-- Step 1: service -->
          <section id="step-1" aria-labelledby="step-1-title">
            <h2 id="step-1-title" tabindex="-1" data-i18n="book.chooseService"></h2>
            <div class="service-options" id="service-options">
              <p class="panel-sub" data-i18n="common.loading"></p>
            </div>
            <div class="panel-actions">
              <button class="btn btn-primary" type="button" id="to-step-2" disabled>
                <span data-i18n="book.next"></span><span class="flip-rtl" data-icon="arrow"></span>
              </button>
            </div>
          </section>

          <!-- Step 2: date & time -->
          <section id="step-2" aria-labelledby="step-2-title" hidden>
            <h2 id="step-2-title" tabindex="-1" data-i18n="book.chooseTime"></h2>
            <p class="panel-sub" data-i18n="book.chooseTimeSub"></p>
            <div id="time-alert"></div>
            <div class="schedule-grid">
              <div>
                <div class="calendar-head">
                  <button class="icon-btn" type="button" id="prev-month" data-i18n-attr="aria-label:a11y.prevMonth"><span class="flip-rtl" data-icon="chevronPrev"></span></button>
                  <h3 id="month-label" aria-live="polite"></h3>
                  <button class="icon-btn" type="button" id="next-month" data-i18n-attr="aria-label:a11y.nextMonth"><span class="flip-rtl" data-icon="chevronNext"></span></button>
                </div>
                <div class="calendar-grid" id="calendar" role="group" aria-labelledby="month-label"></div>
              </div>
              <div>
                <h3 class="slots-head" id="slots-title"></h3>
                <p class="slots-note" data-i18n="book.tzNote"></p>
                <div id="slots" aria-live="polite"></div>
              </div>
            </div>
            <div class="panel-actions">
              <button class="btn btn-ghost" type="button" data-go="1">
                <span class="flip-rtl" data-icon="chevronPrev"></span><span data-i18n="book.back"></span>
              </button>
              <button class="btn btn-primary" type="button" id="to-step-3" disabled>
                <span data-i18n="book.next"></span><span class="flip-rtl" data-icon="arrow"></span>
              </button>
            </div>
          </section>

          <!-- Step 3: details -->
          <section id="step-3" aria-labelledby="step-3-title" hidden>
            <h2 id="step-3-title" tabindex="-1" data-i18n="book.details"></h2>
            <form class="form" id="details-form" novalidate>
              <div class="field">
                <label for="b-name" data-i18n="contact.formName"></label>
                <input id="b-name" name="name" autocomplete="name" required maxlength="80">
              </div>
              <div class="form-row">
                <div class="field">
                  <label for="b-phone" data-i18n="contact.formPhone"></label>
                  <input id="b-phone" name="phone" type="tel" autocomplete="tel" required maxlength="30">
                </div>
                <div class="field">
                  <label for="b-email"><span data-i18n="contact.formEmail"></span> <span class="optional" data-i18n="contact.optional"></span></label>
                  <input id="b-email" name="email" type="email" autocomplete="email" maxlength="120" data-i18n-attr="placeholder:book.emailHint">
                </div>
              </div>
              <div class="field">
                <label for="b-notes"><span data-i18n="book.notes"></span> <span class="optional" data-i18n="contact.optional"></span></label>
                <textarea id="b-notes" name="notes" maxlength="1000"></textarea>
              </div>
              <!-- Paying by Bit or PayBox: what the client pays for (only then; book.js) -->
              <fieldset class="plan-options" id="plan-options" hidden>
                <legend data-i18n="book.planTitle"></legend>
                <label class="plan-option">
                  <input type="radio" name="plan" value="single" checked>
                  <span class="plan-text"><span class="plan-name" data-i18n="book.planSingle"></span></span>
                  <span class="plan-price" data-plan-price="single"></span>
                </label>
                <label class="plan-option">
                  <input type="radio" name="plan" value="pack">
                  <span class="plan-text"><span class="plan-name" id="plan-pack-name"></span><span class="plan-sub" id="plan-pack-sub"></span></span>
                  <span class="plan-price" data-plan-price="pack"></span>
                </label>
                <label class="plan-option">
                  <input type="radio" name="plan" value="card">
                  <span class="plan-text"><span class="plan-name" data-i18n="book.planCard"></span><span class="plan-sub" data-i18n="book.planCardSub"></span></span>
                </label>
                <p class="plan-note" data-i18n="book.planHow"></p>
              </fieldset>
              <label class="checkbox">
                <input type="checkbox" name="consent" required>
                <span data-i18n="book.consent"></span>
              </label>
              <div id="details-alert" role="status"></div>
              <div class="panel-actions">
                <button class="btn btn-ghost" type="button" data-go="2">
                  <span class="flip-rtl" data-icon="chevronPrev"></span><span data-i18n="book.back"></span>
                </button>
                <button class="btn btn-primary" type="submit" id="confirm-btn" data-i18n="book.confirm"></button>
              </div>
            </form>
          </section>
        </div>

        <aside class="panel summary" aria-labelledby="summary-title">
          <h3 id="summary-title" data-i18n="book.summary"></h3>
          <dl id="summary"></dl>
          <p class="summary-note" data-i18n="book.summaryNote"></p>
        </aside>
      </div>
    </div>

    <!-- Confirmation -->
    <section class="container" id="confirmation" hidden>
      <div class="panel confirmation">
        <div class="check" data-icon="checkCircle"></div>
        <h2 id="confirm-title" tabindex="-1" data-i18n="book.successTitle"></h2>
        <p id="confirm-text"></p>
        <dl id="confirm-details"></dl>
        <!-- Paying by Bit or PayBox: where to send it; then it waits for David's approval -->
        <div class="pay-transfer" id="confirm-pay" hidden>
          <div class="pay-to">
            <span data-i18n="book.payTo"></span>
            <bdi class="pay-phone" id="pay-phone"></bdi>
            <button class="btn btn-outline btn-sm" type="button" id="copy-phone" data-i18n="book.copy"></button>
          </div>
          <p class="pay-note" id="pay-note"></p>
        </div>
        <p class="pay-status" id="pay-status" role="status" hidden></p>
        <p class="panel-sub" id="confirm-email" data-i18n="book.successEmail" hidden></p>
        <ul class="prep">
          <li class="prep-head"><p class="prep-title" data-i18n="book.prepTitle"></p></li>
          <li><span class="prep-icon" data-icon="clock"></span><span data-i18n="visit.prep1"></span></li>
          <li><span class="prep-icon" data-icon="shirt"></span><span data-i18n="visit.prep2"></span></li>
          <li><span class="prep-icon" data-icon="parking"></span><span data-i18n="visit.parking"></span></li>
          <li><span class="prep-icon" data-icon="calendarX"></span><span data-i18n="visit.prep3"></span></li>
        </ul>
        <div class="hero-ctas center">
          <a class="btn btn-primary" id="confirm-whatsapp" target="_blank" rel="noopener" hidden><span data-icon="whatsapp"></span><span data-i18n="book.waButton"></span></a>
          <a class="btn btn-outline" href="/" data-i18n="book.home"></a>
          <a class="btn btn-outline" href="/book" data-i18n="book.another"></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom compact">
        <span>© <span data-biz="year"></span> <span data-biz="name"></span>. <span data-i18n="footer.rights"></span></span>
        <span class="footer-links">
          <span data-biz-item><a data-biz-href="phone"><bdi data-biz="phone"></bdi></a></span>
          <button class="linklike" type="button" data-open-statement data-i18n="a11y.statement"></button>
          <a href="/admin" rel="nofollow" data-i18n="footer.admin"></a>
        </span>
      </div>
    </div>
  </footer>

  <a class="whatsapp-fab" data-biz-href="whatsapp" target="_blank" rel="noopener" data-i18n-attr="aria-label:a11y.whatsapp" data-icon="whatsapp" hidden></a>
  <nav class="action-bar" data-i18n-attr="aria-label:mobile.bar">
    <a class="btn btn-primary" href="/book" data-i18n="mobile.book"></a>
    <a class="icon-btn" data-biz-href="whatsapp" target="_blank" rel="noopener" data-icon="whatsapp" data-i18n-attr="aria-label:a11y.whatsapp"></a>
    <a class="icon-btn" data-biz-href="phone" data-icon="phone" data-i18n-attr="aria-label:a11y.call"></a>
  </nav>
</body>
</html>
